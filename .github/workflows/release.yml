name: Windows release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); from version import RELEASE_TAG; print(RELEASE_TAG)"
          if ($version -ne $env:GITHUB_REF_NAME) { throw 'Release tag must match src/version.py' }
      - name: Install build dependencies
        run: python -m pip install -r requirements/release.txt
      - name: Build capture helper
        shell: cmd
        run: build-capture.cmd
      - name: Run offline regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/offline.py
      - name: Install checksum-verified compiler
        shell: pwsh
        run: ./scripts/release/install_compiler.ps1
      - name: Build and smoke-test frozen application and installer
        shell: pwsh
        run: python scripts/release/build.py --iscc "$env:RUNNER_TEMP\whistle-inno\ISCC.exe"
      - name: Verify installer, upgrade and data-preserving uninstall
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); from version import VERSION; print(VERSION)"
          python scripts/release/verify_installer.py "dist/Whistle-Setup-$version-x64.exe"
      - name: Upload tested installer and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Whistle-Windows-x64
          path: |
            dist/Whistle-Setup-*-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Whistle-Windows-x64
          path: dist
      - name: Verify and publish tested stable installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt
          cd ..
          version="${GITHUB_REF_NAME#v}"
          sed "s/@VERSION@/$version/g" scripts/release/notes.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Whistle $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$GITHUB_REF_NAME" "dist/Whistle-Setup-$version-x64.exe" dist/SHA256SUMS.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
