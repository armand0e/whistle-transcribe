name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: Offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0
      - name: Install dependencies
        run: python -m pip install PySide6==6.12.0 numpy==2.5.4 soxr==1.1.0 av==19.0.2 "yt-dlp[default]==2026.10.26"
      - name: Build the native capture helper
        if: runner.os == 'Windows'
        shell: cmd
        run: build-capture.cmd
      - name: Check the capture helper starts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & .\bin\capture.exe 2>&1
          if ($LASTEXITCODE -ne 1 -or "$output" -notmatch 'Usage') { throw "Unexpected helper output: $output" }
          exit 0  # The runner would otherwise re-raise the helper's expected exit code 1.
      - name: Run offline tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/offline.py
