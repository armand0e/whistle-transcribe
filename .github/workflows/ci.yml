name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: Offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Build the native capture helper
        if: runner.os == 'Windows'
        shell: cmd
        run: build-capture.cmd
      - name: Check the capture helper starts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & .\bin\capture.exe 2>&1
          if ($LASTEXITCODE -ne 1 -or "$output" -notmatch 'Usage') { throw "Unexpected helper output: $output" }
          exit 0  # The runner would otherwise re-raise the helper's expected exit code 1.
      - name: Run offline tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/offline.py
